<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>배움기록표 앱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .word-keep {
            word-break: keep-all;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(-5%);
                animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
            }

            50% {
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .5;
            }
        }

        .animate-bounce {
            animation: bounce 1s infinite;
        }

        .animate-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { motion, AnimatePresence, Reorder } from 'https://esm.sh/framer-motion@10.16.4?deps=react@18.2.0,react-dom@18.2.0';
        import { Volume2, VolumeX, ArrowRight, RefreshCcw, Download, Check, X, Star, Trophy, Home, Sparkles, PlayCircle, ClipboardList, Mic, Loader2, Users, Play, Square } from 'https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0';

        // ==========================================
        // 🔴 선생님 수정 영역: 구글 앱스 스크립트 배포 URL 
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxrN4h6AhSrm4nZzaf8FH5v1d6UUQR7XaQft0WtBhAjYl5q8jeCjMFt2jOWGkRvGfntBA/exec";
        // 예: "https://script.google.com/macros/s/AAAA/exec" 
        // 값을 비워두면 로컬 테스트 모드(가짜 데이터)로 작동합니다.

        const ORDINALS = ["첫", "두", "세", "네", "다섯", "여섯", "일곱", "여덟", "아홉", "열", "열한", "열두", "열세", "열네", "열다섯"];

        // --- 0. 오디오 및 TTS 시스템 ---
        const audioCtx = typeof window !== 'undefined' ? new (window.AudioContext || window.webkitAudioContext)() : null;
        let currentUtterance = null;

        const speak = (text, rate = 0.85, pitch = 1.0) => {
            if (typeof window === 'undefined' || !window.speechSynthesis) return;
            const synth = window.speechSynthesis;
            if (synth.getVoices().length === 0) {
                setTimeout(() => speak(text, rate, pitch), 50);
                return;
            }
            if (synth.speaking) synth.cancel();
            const utterThis = new SpeechSynthesisUtterance(text);
            const setVoice = () => {
                const voices = synth.getVoices();
                let voice = voices.find(v => v.lang === 'ko-KR' && v.name.includes('Google'));
                if (!voice) voice = voices.find(v => v.lang === 'ko-KR');
                if (voice) utterThis.voice = voice;
            };
            setVoice(); utterThis.rate = rate; utterThis.pitch = pitch;
            currentUtterance = utterThis; utterThis.onend = () => { currentUtterance = null; };
            synth.speak(utterThis);
        };

        const playChime = () => {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, t); osc.frequency.setValueAtTime(659.25, t + 0.1); osc.frequency.setValueAtTime(783.99, t + 0.2);
            gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 1.5);
            osc.start(t); osc.stop(t + 1.5);
        };

        const playWrongSound = () => {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const t = audioCtx.currentTime; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(150, t); osc.frequency.linearRampToValueAtTime(100, t + 0.3);
            gain.gain.setValueAtTime(0.2, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
            osc.start(t); osc.stop(t + 0.5);
        };

        const initAudioContext = () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); };

        // 스케일 반응형 훅 (비율 유지 확대/축소)
        function useScale(baseWidth = 1024, baseHeight = 768) {
            const [scale, setScale] = useState(1);
            useEffect(() => {
                const updateScale = () => {
                    const widthRatio = window.innerWidth / baseWidth;
                    const heightRatio = window.innerHeight / baseHeight;
                    // 꽉 차게 하되 잘리지 않도록 둘 중 더 작은 비율 적용
                    setScale(Math.min(widthRatio, heightRatio) * 0.98);
                };
                window.addEventListener('resize', updateScale);
                updateScale();
                return () => window.removeEventListener('resize', updateScale);
            }, [baseWidth, baseHeight]);
            return scale;
        }

        const PencilFairy = ({ className = "" }) => (
            <motion.div className={`relative inline-block ${className}`} animate={{ y: [0, -12, 0] }} transition={{ repeat: Infinity, duration: 2.5, ease: "easeInOut" }}>
                <svg width="150" height="180" viewBox="0 0 120 150" fill="none">
                    <path d="M45 55C25 45 15 75 30 85C15 95 20 115 40 105" stroke="#A0AEC0" strokeWidth="3" strokeLinecap="round" style={{ transformOrigin: "45px 55px", transform: "rotate(-10deg)" }} />
                    <path d="M75 55C95 45 105 75 90 85C105 95 100 115 80 105" stroke="#A0AEC0" strokeWidth="3" strokeLinecap="round" style={{ transformOrigin: "75px 55px", transform: "rotate(10deg)" }} />
                    <path d="M45 30L75 30V110L60 135L45 110V30Z" fill="#F6AD55" stroke="#4A5568" strokeWidth="2" />
                    <path d="M55 30V110" stroke="#ED8936" strokeWidth="1" />
                    <path d="M65 30V110" stroke="#ED8936" strokeWidth="1" />
                    <path d="M45 110L60 135L75 110H45Z" fill="#FBD38D" stroke="#4A5568" strokeWidth="2" />
                    <path d="M54 125L60 135L66 125H54Z" fill="#2D3748" />
                    <path d="M45 15C45 10 75 10 75 15V30H45V15Z" fill="#FBB6CE" stroke="#4A5568" strokeWidth="2" />
                    <rect x="45" y="25" width="30" height="5" fill="#CBD5E0" stroke="#4A5568" strokeWidth="1" />
                    <circle cx="53" cy="65" r="2" fill="#2D3748" />
                    <circle cx="67" cy="65" r="2" fill="#2D3748" />
                    <path d="M58 75C58 75 60 78 62 75" stroke="#2D3748" strokeWidth="1.5" strokeLinecap="round" />
                    <circle cx="50" cy="70" r="3" fill="#FED7E2" opacity="0.6" />
                    <circle cx="70" cy="70" r="3" fill="#FED7E2" opacity="0.6" />
                </svg>
            </motion.div>
        );

        const MOCK_DATA = {
            students: ["김바이브", "박코딩", "이AI", "최테스트", "백엔드"],
            questions: [
                { id: 1, type: 'order', img: '🌞', answer: '해가 쨍쨍 비쳐요', pieces: ['해가', '쨍쨍', '비쳐요'] },
                { id: 2, type: 'order', img: '🐿️', answer: '다람쥐가 도토리를 먹어요', pieces: ['다람쥐가', '도토리를', '먹어요'] },
                { id: 3, type: 'order', img: '🏫', answer: '나는 학교에 갑니다', pieces: ['나는', '학교에', '갑니다'] },
                { id: 4, type: 'order', img: '🌸', answer: '꽃이 활짝 피었습니다', pieces: ['꽃이', '활짝', '피었습니다'] },
                { id: 5, type: 'order', img: '🦋', answer: '나비가 팔랑팔랑 날아요', pieces: ['나비가', '팔랑팔랑', '날아요'] },
                { id: 6, type: 'order', img: '🍎', answer: '사과가 아주 맛있어요', pieces: ['사과가', '아주', '맛있어요'] },
                { id: 7, type: 'order', img: '🚌', answer: '노란 버스를 타고 가요', pieces: ['노란', '버스를', '타고 가요'] }
            ]
        };

        const App = () => {
            // 앱 상태 관리
            const [phase, setPhase] = useState('loading');
            const [dbData, setDbData] = useState({ students: [], questions: [] });
            const [currStudent, setCurrStudent] = useState("");
            const scale = useScale(1024, 768);
            const [micGranted, setMicGranted] = useState(false);

            const [qIndex, setQIndex] = useState(0);
            const [activeQuestions, setActiveQuestions] = useState([]);
            const [reviewQuestions, setReviewQuestions] = useState([]);
            const [wrongList, setWrongList] = useState([]);
            const [history, setHistory] = useState([]);
            const [feedback, setFeedback] = useState(null);
            const [isReviewMode, setIsReviewMode] = useState(false);
            const [isSoundOn, setIsSoundOn] = useState(false);
            const [showConfetti, setShowConfetti] = useState(false);

            // 드래그/문장 맞추기 상태
            const [shuffledPieces, setShuffledPieces] = useState([]);
            const [selectedPieces, setSelectedPieces] = useState([]);
            const [wrongIndices, setWrongIndices] = useState([]);

            // 음성 인식 + 녹음 상태
            const [isListening, setIsListening] = useState(false);
            const [speechFeedback, setSpeechFeedback] = useState(null);
            const [recordings, setRecordings] = useState([]); // [{sentence, fileUrl, localUrl}]
            const [isRecording, setIsRecording] = useState(false);
            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const [playingUrl, setPlayingUrl] = useState(null);
            const audioPlayerRef = useRef(null);
            const micStreamRef = useRef(null); // 마이크 스트림 영구 보관

            const currentQList = isReviewMode ? reviewQuestions : activeQuestions;
            const currentQ = currentQList[qIndex];

            // 마이크 권한 요청 함수 (스트림을 유지하여 재요청 방지)
            const requestMicPermission = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    micStreamRef.current = stream; // 스트림 보관 (해제하지 않음!)
                    setMicGranted(true);
                } catch (err) {
                    console.warn("마이크 권한 거부:", err);
                    setMicGranted(false);
                }
                setPhase('select_student');
            };

            // 마이크 권한 상태 확인 (이미 스트림이 있거나 허용됐으면 건너뛰기)
            const checkMicAndProceed = async () => {
                // 이미 스트림을 갖고 있으면 바로 진행
                if (micStreamRef.current && micStreamRef.current.active) {
                    setMicGranted(true);
                    setPhase('select_student');
                    return;
                }
                try {
                    if (navigator.permissions) {
                        const permStatus = await navigator.permissions.query({ name: 'microphone' });
                        if (permStatus.state === 'granted') {
                            // 권한이 이미 있으면 스트림 확보 후 진행
                            try {
                                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                                micStreamRef.current = stream;
                            } catch (e) { }
                            setMicGranted(true);
                            setPhase('select_student');
                            return;
                        }
                    }
                } catch (e) { /* permissions API 미지원 브라우저 */ }
                setPhase('mic_permission');
            };

            // 데이터 로딩
            useEffect(() => {
                const loadData = async () => {
                    if (!GAS_URL) {
                        console.log("GAS_URL이 없습니다. 테스트 모드로 실행합니다.");
                        setTimeout(async () => {
                            setDbData(MOCK_DATA);
                            await checkMicAndProceed();
                        }, 1000);
                        return;
                    }
                    try {
                        const res = await fetch(GAS_URL);
                        const data = await res.json();
                        if (data.status === 'success') {
                            setDbData({ students: data.students, questions: data.questions });
                            await checkMicAndProceed();
                        } else throw new Error(data.message);
                    } catch (err) {
                        console.error("데이터 로딩 실패:", err);
                        alert("구글 시트 연동 실패! 테스트 모드로 전환합니다.");
                        setDbData(MOCK_DATA);
                        await checkMicAndProceed();
                    }
                };
                loadData();
            }, []);

            useEffect(() => {
                if (currentQ && phase === 'activity' && !feedback) {
                    const pieces = [...currentQ.pieces].sort(() => Math.random() - 0.5);
                    setShuffledPieces(pieces);
                    setSelectedPieces([]);
                    setWrongIndices([]);
                }
            }, [currentQ?.id, isReviewMode, phase]);

            // 효과음 & TTS 로직
            useEffect(() => {
                if (!isSoundOn) return;
                if (phase === 'intro') {
                    const timer = setTimeout(() => speak(`안녕하세요 ${currStudent} 어린이! 그림을 보고 어울리는 문장을 완성해봐요!`), 500);
                    return () => clearTimeout(timer);
                } else if (phase === 'level_select') {
                    speak("문제를 몇 개 풀어볼까요? 갯수를 선택하세요.");
                } else if (phase === 'activity' && currentQ && !feedback) {
                    const ordinal = ORDINALS[qIndex] || (qIndex + 1);
                    const orderText = isReviewMode ? "다시 풀어보는 문제." : `${ordinal} 번째 문제.`;
                    speak(`${orderText} 그림을 보고, 낱말 카드를 순서대로 선택해보세요.`);
                } else if (phase === 'speak_mission') {
                    speak("정답입니다! 마이크 버튼을 누르고 전체 문장을 큰 소리로 읽어보세요!");
                } else if (phase === 'report') {
                    speak("모든 활동이 끝났어요! 오늘 배움 기록 표를 살펴봅시다.");
                }
            }, [phase, qIndex, isReviewMode, feedback, isSoundOn]);

            useEffect(() => {
                if (phase === 'report') {
                    setShowConfetti(true);
                    saveResultToServer();
                }
            }, [phase]);

            const saveResultToServer = async () => {
                if (!GAS_URL) return;
                try {
                    const payload = {
                        studentName: currStudent,
                        totalQuestions: activeQuestions.length,
                        correctOnFirstTry: history.filter(h => h.correct).length,
                        wrongList: wrongList.map(q => q.answer),
                        recordings: recordings.map(r => ({ sentence: r.sentence, fileUrl: r.fileUrl || '' }))
                    };
                    await fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.error("결과 전송 실패:", e);
                }
            };

            // --- 녹음 업로드 함수 ---
            const uploadAudioToServer = async (audioBlob, sentence) => {
                if (!GAS_URL) {
                    // 테스트 모드: 로컬 URL만 사용
                    const localUrl = URL.createObjectURL(audioBlob);
                    return { localUrl, fileUrl: '' };
                }
                try {
                    const reader = new FileReader();
                    const base64 = await new Promise((resolve) => {
                        reader.onloadend = () => {
                            const base64data = reader.result.split(',')[1];
                            resolve(base64data);
                        };
                        reader.readAsDataURL(audioBlob);
                    });
                    const res = await fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'uploadAudio',
                            studentName: currStudent,
                            sentence: sentence,
                            audioData: base64
                        })
                    });
                    const result = await res.json();
                    if (result.status === 'success') {
                        const localUrl = URL.createObjectURL(audioBlob);
                        return { localUrl, fileUrl: result.fileUrl };
                    }
                } catch (e) {
                    console.error("녹음 업로드 실패:", e);
                }
                const localUrl = URL.createObjectURL(audioBlob);
                return { localUrl, fileUrl: '' };
            };

            // --- 재생 함수 ---
            const playRecording = (url) => {
                if (audioPlayerRef.current) {
                    audioPlayerRef.current.pause();
                    audioPlayerRef.current = null;
                }
                if (playingUrl === url) {
                    setPlayingUrl(null);
                    return;
                }
                const audio = new Audio(url);
                audioPlayerRef.current = audio;
                setPlayingUrl(url);
                audio.play();
                audio.onended = () => { setPlayingUrl(null); audioPlayerRef.current = null; };
            };

            // --- 녹음 수동 종료 ---
            const stopRecording = async () => {
                const mr = mediaRecorderRef.current;
                if (mr && mr.state !== 'inactive') {
                    mr.stop(); // 스트림은 해제하지 않음 (재사용)
                }
                setIsRecording(false);
                setIsListening(false);
                // 녹음 파일 저장
                await new Promise(r => setTimeout(r, 400));
                if (audioChunksRef.current.length > 0) {
                    const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
                    const result = await uploadAudioToServer(audioBlob, currentQ.answer);
                    setRecordings(prev => [...prev, { sentence: currentQ.answer, localUrl: result.localUrl, fileUrl: result.fileUrl }]);
                }
            };

            const handleLevelSelect = (count) => {
                let shuffled = [...dbData.questions].sort(() => 0.5 - Math.random());
                while (shuffled.length < count) {
                    shuffled = shuffled.concat([...shuffled].sort(() => 0.5 - Math.random()));
                }
                setActiveQuestions(shuffled.slice(0, count));
                setQIndex(0); setWrongList([]); setHistory([]); setPhase('activity');
            };

            // --- 드래그 핸들링 ---
            const handleReorder = (newOrder) => {
                setWrongIndices([]);
                if (feedback?.type === 'incorrect_inline') setFeedback(null);
                setSelectedPieces(newOrder);
            };

            // --- 클릭 리셋 기능 ---
            const handlePieceClick = (piece, from) => {
                if (isSoundOn) speak(piece);
                setWrongIndices([]);
                if (feedback?.type === 'incorrect_inline') setFeedback(null);

                if (from === 'shuffled') {
                    setShuffledPieces(prev => prev.filter(p => p !== piece));
                    setSelectedPieces(prev => [...prev, piece]);
                } else {
                    // 선택한 카드를 다시 누르면 밑으로 리셋
                    setSelectedPieces(prev => prev.filter(p => p !== piece));
                    setShuffledPieces(prev => [...prev, piece]);
                }
            };

            const checkAnswer = () => {
                const answerArr = currentQ.answer.split(' ');
                const isCorrect = selectedPieces.join(' ') === currentQ.answer;

                if (!isReviewMode && !history.find(h => h.id === currentQ.id && h.u_idx === qIndex)) {
                    setHistory(prev => [...prev, { id: currentQ.id, u_idx: qIndex, question: currentQ.answer, correct: isCorrect }]);
                }

                if (isCorrect) {
                    if (isSoundOn) playChime();
                    setFeedback({ type: 'correct', msg: "잘했어요!" });
                    setTimeout(() => {
                        setFeedback(null);
                        setSpeechFeedback(null);
                        setPhase('speak_mission');
                    }, 1000);
                } else {
                    if (isSoundOn) playWrongSound();
                    const wrongIdxs = [];
                    selectedPieces.forEach((p, idx) => {
                        if (p !== answerArr[idx]) wrongIdxs.push(idx);
                    });
                    setWrongIndices(wrongIdxs);
                    setFeedback({ type: 'incorrect_inline', msg: "문장 카드를 드래그해서 위치를 바꾸거나 눌러서 다시 해봐요." });
                    if (isSoundOn) speak("순서가 맞지 않는 낱말이 있어요. 빨간색 낱말을 다시 옮겨보세요.");
                    if (!wrongList.find(q => q.id === currentQ.id)) {
                        setWrongList(prev => [...prev, currentQ]);
                    }
                }
            };

            // --- 녹음 시작 (저장된 스트림만 사용, SpeechRecognition 없음 → 권한 재요청 없음) ---
            const startRecordingOnly = () => {
                setSpeechFeedback(null);
                audioChunksRef.current = [];

                try {
                    let stream = micStreamRef.current;
                    if (!stream || !stream.active) {
                        setSpeechFeedback({ type: 'error', text: "마이크가 연결되지 않았어요. 새로고침 후 다시 시도해주세요." });
                        return;
                    }
                    const mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                    mediaRecorderRef.current = mediaRecorder;
                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunksRef.current.push(event.data);
                    };
                    mediaRecorder.start();
                    setIsRecording(true);
                    setSpeechFeedback({ type: 'recording', text: "🔴 녹음 중... 문장을 큰 소리로 읽어주세요!" });
                } catch (e) {
                    console.warn("녹음 시작 실패:", e);
                    setSpeechFeedback({ type: 'error', text: "녹음을 시작할 수 없어요." });
                }
            };

            const handleNext = () => {
                if (qIndex < currentQList.length - 1) {
                    setQIndex(prev => prev + 1);
                    setPhase('activity');
                } else {
                    setPhase('report');
                }
            };

            const startReview = () => {
                setIsReviewMode(true);
                setReviewQuestions([...wrongList]);
                setWrongList([]);
                setQIndex(0);
                setPhase('activity');
            };

            const downloadStamp = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 800; canvas.height = 1200;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 800, 1200);
                ctx.fillStyle = '#f0fdf4'; ctx.fillRect(0, 0, 800, 550);
                ctx.fillStyle = '#1e3a8a'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('📊 오늘의 배움기록표', 400, 80);

                ctx.fillStyle = '#eff6ff'; ctx.beginPath(); ctx.roundRect(100, 120, 280, 120, 20); ctx.fill();
                ctx.fillStyle = '#64748b'; ctx.font = 'bold 24px sans-serif'; ctx.fillText('전체 문제', 240, 160);
                ctx.fillStyle = '#2563eb'; ctx.font = 'bold 50px sans-serif'; ctx.fillText(`${activeQuestions.length}개`, 240, 210);

                ctx.fillStyle = '#f0fdf4'; ctx.beginPath(); ctx.roundRect(420, 120, 280, 120, 20); ctx.fill();
                ctx.fillStyle = '#64748b'; ctx.font = 'bold 24px sans-serif'; ctx.fillText('한번에 성공!', 560, 160);
                ctx.fillStyle = '#16a34a'; ctx.font = 'bold 50px sans-serif'; ctx.fillText(`${history.filter(h => h.correct).length}개`, 560, 210);

                ctx.fillStyle = '#334155'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText('📋 배움 기록', 100, 300);
                ctx.font = '22px sans-serif';
                let yPos = 350;
                history.slice(0, 5).forEach((h) => {
                    const mark = h.correct ? '✅' : '🔺';
                    ctx.fillStyle = h.correct ? '#475569' : '#f97316';
                    ctx.fillText(`${mark} ${h.question}`, 100, yPos);
                    yPos += 40;
                });

                const certY = 550;
                ctx.fillStyle = '#fff9f0'; ctx.fillRect(0, certY, 800, 1200 - certY);
                ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 20; ctx.strokeRect(40, certY + 40, 720, 1200 - certY - 80);
                ctx.textAlign = 'center';
                ctx.font = '100px Arial'; ctx.fillText('🏆', 400, certY + 180);
                ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 60px sans-serif'; ctx.fillText('참 잘했어요!', 400, certY + 280);
                ctx.fillStyle = '#333'; ctx.font = 'bold 40px sans-serif'; ctx.fillText("그림에 어울리는 문장 완성하기", 400, certY + 360);
                ctx.font = '30px sans-serif'; ctx.fillStyle = '#64748b';
                ctx.fillText("위 어린이는 문장을 바르게 완성하고 큰 소리로 읽어", 400, certY + 440);
                ctx.fillText("이 상장을 수여합니다.", 400, certY + 490);
                ctx.font = '24px sans-serif'; ctx.fillStyle = '#94a3b8';
                ctx.fillText(`${new Date().toLocaleDateString()}`, 400 - 150, certY + 580);
                ctx.font = '120px Arial'; ctx.fillText('💯', 400 + 180, certY + 580);

                const link = document.createElement('a');
                link.download = `${currStudent}_배움기록표.png`;
                link.href = canvas.toDataURL(); link.click();
            };

            // ==========================================
            // 렌더링 영역 (Scale Wrapper 내부에 위치)
            // ==========================================
            // 스피커 토글 버튼 (모든 화면 공통)
            const SoundToggle = ({ position = 'top-right' }) => (
                <button onClick={() => setIsSoundOn(!isSoundOn)}
                    className={`absolute top-6 right-6 z-50 p-3 rounded-2xl shadow-md border border-slate-100 transition-all ${isSoundOn ? 'bg-orange-100 text-orange-600' : 'bg-white/80 text-slate-400 hover:text-slate-600'}`}>
                    {isSoundOn ? <Volume2 size={28} /> : <VolumeX size={28} />}
                </button>
            );

            const renderPhase = () => {
                if (phase === 'loading') {
                    return (
                        <div className="flex flex-col items-center justify-center h-full w-full gap-4 text-slate-500 font-bold bg-slate-50 rounded-[3rem]">
                            <Loader2 className="animate-spin text-orange-500" size={60} />
                            <p className="text-2xl mt-4">데이터를 불러오는 중입니다...</p>
                        </div>
                    );
                }

                if (phase === 'mic_permission') {
                    return (
                        <div className="flex flex-col items-center justify-center h-full w-full p-8 text-center bg-slate-50 rounded-[3rem] relative">
                            <SoundToggle />
                            <div className="bg-green-100 p-8 rounded-full mb-8 shadow-lg">
                                <Mic size={80} className="text-green-600" />
                            </div>
                            <h1 className="text-4xl font-black text-slate-800 mb-4 word-keep">마이크 사용을 허용해주세요!</h1>
                            <p className="text-xl text-slate-500 mb-10 word-keep leading-relaxed">나중에 문장을 소리 내어 읽는 활동이 있어요.<br />아래 버튼을 눌러 마이크를 미리 허용해주세요.</p>
                            <button onClick={requestMicPermission}
                                className="w-full max-w-sm py-6 bg-green-500 hover:bg-green-600 text-white rounded-3xl font-black text-3xl shadow-xl active:scale-95 flex items-center justify-center gap-3 transition-all mb-4">
                                <Mic size={32} /> 마이크 허용하기
                            </button>
                            <button onClick={() => { setMicGranted(false); setPhase('select_student'); }}
                                className="text-slate-400 hover:text-slate-600 font-bold text-lg mt-2 underline">
                                마이크 없이 진행하기
                            </button>
                        </div>
                    );
                }

                if (phase === 'select_student') {
                    return (
                        <div className="flex flex-col items-center justify-center h-full w-full p-8 text-center bg-blue-50 rounded-[3rem] relative">
                            <SoundToggle />
                            <div className="bg-white px-6 py-2 rounded-full font-bold select-none text-blue-600 mb-6 flex items-center gap-2 text-xl shadow-sm border border-blue-100">
                                <Users size={24} /> 내 이름 찾기
                            </div>
                            <h1 className="text-4xl font-black text-slate-800 mb-10">드롭다운을 눌러 내 이름을 선택해주세요!</h1>
                            <div className="flex flex-col items-center justify-center gap-6 w-full max-w-xl bg-white p-10 border-4 border-blue-100 rounded-3xl shadow-xl">
                                <div className="relative w-full">
                                    <select
                                        value={currStudent}
                                        onChange={(e) => setCurrStudent(e.target.value)}
                                        className="w-full text-3xl p-6 rounded-2xl border-4 border-blue-200 bg-slate-50 hover:bg-blue-50 text-slate-700 font-bold focus:outline-none focus:border-blue-500 appearance-none text-center cursor-pointer shadow-inner transition-colors"
                                    >
                                        <option value="" disabled>내 이름을 골라주세요 ▼</option>
                                        {dbData.students.map((name, i) => (
                                            <option key={i} value={name}>{name}</option>
                                        ))}
                                    </select>
                                    <div className="pointer-events-none absolute inset-y-0 right-6 flex items-center px-2 text-blue-500">
                                        <svg className="fill-current h-8 w-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z" /></svg>
                                    </div>
                                </div>
                                <button
                                    onClick={() => { initAudioContext(); setPhase('start'); }}
                                    disabled={!currStudent}
                                    className="w-full mt-4 px-8 py-6 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-black text-3xl rounded-[2rem] shadow-lg active:scale-95 transition-all"
                                >
                                    선택 완료
                                </button>
                            </div>
                        </div>
                    );
                }

                if (phase === 'start') {
                    return (
                        <div className="flex flex-col items-center justify-center h-full w-full bg-orange-50 p-6 text-center select-none rounded-[3rem] relative">
                            <SoundToggle />
                            <motion.div animate={{ scale: [1, 1.1, 1] }} transition={{ repeat: Infinity, duration: 2 }} className="mb-8 cursor-pointer" onClick={() => setPhase('intro')}>
                                <PlayCircle size={100} className="text-orange-500 fill-white" />
                            </motion.div>
                            <h1 className="text-5xl font-black text-slate-800 mb-4 word-keep leading-snug">그림에 어울리는<br />문장 완성하기</h1>
                            <p className="text-2xl text-slate-600 font-bold word-keep">{currStudent} 친구, 준비되었나요? 버튼을 눌러요!</p>
                        </div>
                    );
                }

                if (phase === 'intro') {
                    return (
                        <div className="flex flex-col items-center justify-center h-full w-full bg-orange-50 p-6 text-center select-none rounded-[3rem] relative">
                            <SoundToggle />
                            <div className="scale-150 mb-10"><PencilFairy /></div>
                            <div className="inline-block bg-white text-orange-600 px-6 py-2 rounded-full font-bold mb-6 shadow-sm border border-orange-100 text-xl">국어 1-2학년군</div>
                            <h1 className="text-5xl font-black text-slate-800 mb-8 leading-tight word-keep">그림에 어울리는 문장 완성하기</h1>
                            <div className="bg-white border-4 border-orange-200 p-10 rounded-[3rem] max-w-2xl shadow-xl relative w-full mb-10">
                                <div className="absolute -top-6 left-1/2 -translate-x-1/2 bg-orange-500 text-white px-8 py-3 rounded-full font-black shadow-md flex items-center gap-2 text-xl">
                                    <Volume2 size={24} /> 오늘의 공부 약속
                                </div>
                                <p className="text-4xl font-black text-slate-700 mt-6 leading-normal word-keep tracking-tight">"그림을 보고 어울리는 문장을 완성해봐요!"</p>
                            </div>
                            <button onClick={() => setPhase('level_select')} className="w-full max-w-sm py-6 bg-orange-500 hover:bg-orange-600 text-white rounded-3xl font-black text-3xl shadow-xl active:scale-95 flex items-center justify-center gap-3 transition-all">
                                시작하기 <ArrowRight strokeWidth={4} size={32} />
                            </button>
                        </div>
                    );
                }

                if (phase === 'level_select') {
                    return (
                        <div className="flex flex-col items-center justify-center h-full w-full bg-orange-50 p-6 text-center select-none rounded-[3rem] relative">
                            <SoundToggle />
                            <div className="scale-125 mb-8"><PencilFairy /></div>
                            <h2 className="text-4xl font-black text-slate-800 mb-8">몇 문제를 풀어볼까요?</h2>
                            <div className="grid grid-cols-1 gap-6 w-full max-w-sm">
                                {[5, 10, 15].map(count => (
                                    <button key={count} onClick={() => handleLevelSelect(count)} className="py-6 bg-white border-4 border-orange-200 hover:border-orange-400 rounded-3xl font-black text-3xl text-orange-600 shadow-md active:scale-95 transition-all flex items-center justify-between px-8 group">
                                        <span>{count} 문제</span>
                                        <span className="text-2xl group-hover:scale-125 transition-transform">{count === 5 ? '🌱' : count === 10 ? '🌿' : '🌳'}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    );
                }

                if (phase === 'activity') {
                    return (
                        <div className="flex flex-col items-center justify-center h-full w-full bg-slate-50 p-8 relative select-none rounded-[3rem]">
                            <SoundToggle />
                            <div className="w-full max-w-3xl flex justify-between items-center mb-6 z-20 flex-shrink-0">
                                <button onClick={() => window.location.reload()} className="p-4 bg-white rounded-2xl shadow-md border border-slate-100 text-slate-400 hover:text-orange-500"><Home size={32} /></button>
                                <div className="bg-white px-8 py-3 rounded-full shadow-md border border-slate-100 font-black text-orange-600 flex items-center gap-2 text-2xl">
                                    {isReviewMode ? <span className="text-red-500 flex items-center gap-2"><RefreshCcw size={24} /> 복습 중</span> : <span>문제 {qIndex + 1} / {currentQList.length}</span>}
                                </div>
                                <div className="w-[64px]"></div>
                            </div>

                            <div className="w-full max-w-3xl flex-1 max-h-[850px] bg-white rounded-[3rem] shadow-2xl p-6 md:p-10 text-center border-b-8 border-orange-100 relative z-10 flex flex-col justify-center overflow-hidden">
                                <div className="mb-6 flex-shrink-0">
                                    <span className="text-8xl md:text-9xl block animate-bounce filter drop-shadow-sm">{currentQ.img}</span>
                                </div>
                                <div className="w-full min-h-[140px] bg-orange-50 rounded-3xl border-4 border-dashed border-orange-300 flex flex-col items-center justify-center p-4 mb-6 transition-all relative flex-shrink-0">
                                    {selectedPieces.length === 0 && <span className="text-orange-400 font-bold text-2xl absolute animate-pulse">순서대로 선택해보세요.</span>}
                                    <Reorder.Group axis="x" values={selectedPieces} onReorder={handleReorder} className="flex flex-wrap items-center justify-center gap-3 w-full z-10 p-2">
                                        {selectedPieces.map((p, i) => {
                                            const isWrong = wrongIndices.includes(i);
                                            return (
                                                <Reorder.Item key={p} value={p} onClick={() => handlePieceClick(p, 'selected')}
                                                    className={`px-6 py-4 rounded-2xl shadow-md font-bold text-3xl cursor-grab active:cursor-grabbing word-keep border-b-4 ${isWrong ? 'bg-red-50 text-red-600 border-red-300 shadow-red-200' : 'bg-white text-orange-600 border-orange-200 hover:bg-orange-50'}`}>
                                                    {p}
                                                </Reorder.Item>
                                            );
                                        })}
                                    </Reorder.Group>
                                    {feedback?.type === 'incorrect_inline' && (
                                        <div className="mt-4 text-red-500 font-bold text-xl h-8 flex items-center justify-center">{feedback.msg}</div>
                                    )}
                                </div>
                                <div className="flex flex-wrap justify-center items-center gap-4 mb-6 flex-shrink-0 min-h-[80px]">
                                    {shuffledPieces.map((p, i) => (
                                        <motion.button layoutId={`shuf-${p}`} key={`${p}-${i}`} onClick={() => handlePieceClick(p, 'shuffled')}
                                            className="bg-slate-100 px-6 py-4 rounded-2xl shadow-sm border-2 border-slate-200 font-bold text-3xl text-slate-600 hover:bg-slate-200 word-keep">
                                            {p}
                                        </motion.button>
                                    ))}
                                </div>
                                <button onClick={checkAnswer} disabled={selectedPieces.length !== currentQ.pieces.length}
                                    className="w-full py-6 mt-auto bg-orange-500 disabled:bg-slate-300 text-white rounded-3xl font-black text-3xl shadow-lg active:scale-95 transition-all flex-shrink-0">
                                    정답 확인
                                </button>
                            </div>
                        </div>
                    );
                }

                if (phase === 'speak_mission') {
                    return (
                        <div className="flex flex-col items-center justify-center h-full w-full bg-green-50 p-8 relative select-none rounded-[3rem]">
                            <SoundToggle />
                            <div className="w-full max-w-3xl bg-white rounded-[3rem] shadow-2xl p-10 text-center border-b-8 border-green-200 relative z-10 flex flex-col justify-center h-full">
                                <div className="flex-1 flex flex-col items-center justify-center">
                                    <h2 className="text-3xl font-black mb-8 text-green-600 flex justify-center items-center gap-3">
                                        <Mic size={36} /> 문장을 소리 내어 읽고 녹음해요
                                    </h2>
                                    <div className="text-9xl mb-6 filter drop-shadow-md">{currentQ.img}</div>
                                    <div className="p-8 rounded-[2rem] mb-8 w-full border-4 bg-green-50 border-green-200 flex-shrink-0 shadow-inner">
                                        <p className="text-5xl font-black text-slate-800 word-keep leading-relaxed tracking-tight">{currentQ.answer}</p>
                                    </div>

                                    <div className="h-[40px] mb-6">
                                        {speechFeedback && (
                                            <div className={`text-2xl font-bold ${speechFeedback.type === 'error' ? 'text-red-500' : speechFeedback.type === 'recording' ? 'text-red-500 animate-pulse' : 'text-green-600'}`}>
                                                {speechFeedback.text}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                <div className="flex gap-3 w-full flex-wrap">
                                    {!isRecording ? (
                                        <button onClick={startRecordingOnly}
                                            className="flex-1 py-5 rounded-3xl bg-green-500 hover:bg-green-600 text-white text-2xl font-black shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3">
                                            <Mic size={28} /> 녹음 시작
                                        </button>
                                    ) : (
                                        <button onClick={stopRecording}
                                            className="flex-1 py-5 rounded-3xl bg-red-500 hover:bg-red-600 text-white text-2xl font-black shadow-xl active:scale-95 transition-all flex items-center justify-center gap-3 animate-pulse">
                                            <Square size={28} /> 녹음 종료
                                        </button>
                                    )}
                                    <button onClick={handleNext}
                                        className="px-6 py-5 rounded-[2rem] text-slate-500 bg-slate-100 hover:bg-slate-200 text-xl font-bold shadow-md active:scale-95 transition-all flex flex-col items-center justify-center border-b-4 border-slate-300">
                                        다음으로<span className="text-xs">넘어가기</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    );
                }

                if (phase === 'report') {
                    return (
                        <div className="flex flex-col items-center h-full w-full bg-blue-50 p-4 pt-5 text-center select-none rounded-[3rem] relative overflow-hidden">
                            <SoundToggle />
                            {showConfetti && <div className="fixed inset-0 pointer-events-none bg-black/5 z-0" />}
                            <h1 className="text-2xl font-black text-blue-800 mb-3 flex items-center justify-center gap-2 flex-shrink-0">
                                <Trophy size={28} className="text-yellow-500" /> {currStudent}의 훌륭한 배움기록표
                            </h1>

                            <div className="bg-white w-full max-w-3xl p-4 rounded-[2rem] shadow-xl border-3 border-blue-200 mb-3 flex-shrink-0">
                                <div className="grid grid-cols-2 gap-3 mb-3">
                                    <div className="bg-blue-50 p-3 rounded-xl flex flex-col justify-center items-center">
                                        <p className="text-slate-500 font-bold text-base">전체 문제</p>
                                        <p className="text-4xl font-black text-blue-600">{activeQuestions.length}개</p>
                                    </div>
                                    <div className="bg-green-50 p-3 rounded-xl flex flex-col justify-center items-center">
                                        <p className="text-slate-500 font-bold text-base">한번에 성공!</p>
                                        <p className="text-4xl font-black text-green-600">{history.filter(h => h.correct).length}개</p>
                                    </div>
                                </div>

                                {wrongList.length > 0 && !isReviewMode && (
                                    <div className="mb-3 pt-2 border-t border-slate-200">
                                        <p className="text-orange-500 font-bold mb-2 text-base">아직 헷갈리는 문제가 {wrongList.length}개 있어요!</p>
                                        <button onClick={startReview} className="w-full py-3 bg-orange-400 hover:bg-orange-500 text-white rounded-xl font-bold shadow-md active:scale-95 transition-all flex justify-center items-center gap-2 text-lg">
                                            <RefreshCcw size={20} /> 틀린 문제 다시 풀기
                                        </button>
                                    </div>
                                )}

                                <div className="text-left bg-slate-50 p-3 rounded-xl overflow-hidden flex flex-col max-h-[120px]">
                                    <h3 className="text-lg font-black text-slate-700 mb-2 flex items-center gap-2"><ClipboardList size={18} /> 배움 기록 내역</h3>
                                    <ul className="space-y-1 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                                        {history.map((h, idx) => {
                                            const rec = recordings.find(r => r.sentence === h.question);
                                            return (
                                                <li key={idx} className="flex items-center gap-2 text-base font-medium text-slate-600 border-b border-slate-200 pb-1">
                                                    {h.correct ? <Check className="text-green-500 flex-shrink-0" size={16} /> : <RefreshCcw className="text-orange-500 flex-shrink-0" size={16} />}
                                                    <span className={`flex-1 ${h.correct ? '' : 'text-orange-500 font-bold'}`}>{h.question}</span>
                                                    {rec && rec.localUrl && (
                                                        <button onClick={() => playRecording(rec.localUrl)} className={`flex-shrink-0 p-1.5 rounded-lg transition-all ${playingUrl === rec.localUrl ? 'bg-red-100 text-red-500' : 'bg-green-100 text-green-600 hover:bg-green-200'}`}>
                                                            {playingUrl === rec.localUrl ? <Square size={14} /> : <Play size={14} />}
                                                        </button>
                                                    )}
                                                </li>
                                            );
                                        })}
                                    </ul>
                                </div>
                            </div>

                            <div className="flex gap-3 w-full max-w-3xl z-10 flex-shrink-0 justify-center">
                                <button onClick={downloadStamp} className="flex-1 py-4 bg-green-500 hover:bg-green-600 text-white rounded-2xl font-black text-xl shadow-xl active:scale-95 flex justify-center items-center gap-2 transition-all">
                                    <Download size={24} /> 기록표 저장
                                </button>
                                <button onClick={() => window.location.reload()} className="flex-1 py-4 bg-white hover:bg-slate-100 text-slate-600 border-3 border-slate-200 rounded-2xl font-black text-xl shadow active:scale-95 transition-all flex justify-center items-center gap-2">
                                    <Home size={24} /> 처음으로
                                </button>
                            </div>
                        </div>
                    );
                }

                return null;
            };

            return (
                <div style={{ width: '1024px', height: '768px', transform: `scale(${scale})`, transformOrigin: 'center center', position: 'relative' }} className="shadow-2xl overflow-hidden bg-white rounded-[3rem]">
                    {renderPhase()}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
